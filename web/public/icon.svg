<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Tarianaoxin">
  <!-- Simplified lockup: at 16px a gradient field and the crossing "X" arms
       collapse into mud, so the favicon keeps only the two shapes that still
       read — a solid navy tile and the vessel silhouette. -->
  <rect width="48" height="48" rx="10" fill="#08243b"/>
  <!-- rim band, the one aqua accent (5 units tall = ~1.7px at 16px) -->
  <path d="M10.4 10 H37.6 L36.6 15 H11.4 Z" fill="#4fd6ea"/>
  <!-- vessel body -->
  <path d="M11.4 15 H36.6 L32.7 33.1 A3.8 3.8 0 0 1 28.9 36 H19.1 A3.8 3.8 0 0 1 15.3 33.1 Z" fill="#ffffff"/>
</svg>
